<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GenTri's Best | Reset Password</title>
    <link rel="icon" type="image/png" href="Images/logo1.jpg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --sky-blue: #0ea5e9;
            --sky-blue-hover: #0284c7;
        }

        body {
            background-color: #f0f9ff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        .card {
            width: 100%;
            max-width: 420px;
            border-radius: 1rem;
            box-shadow: 0 0.5rem 1rem rgba(14, 165, 233, 0.15);
        }

        .system-logo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            overflow: hidden;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 3px solid var(--sky-blue);
        }

        .btn-sky {
            background-color: var(--sky-blue);
            color: white;
            border: none;
        }

        .btn-sky:hover {
            background-color: var(--sky-blue-hover);
            color: white;
        }

        .text-sky { color: var(--sky-blue) !important; }

        .input-group-text i { color: var(--sky-blue); }

        .strength-bar {
            height: 4px;
            border-radius: 2px;
            transition: width .3s, background-color .3s;
        }
    </style>
</head>

<body>
    <main class="card p-4 border-0">
        <div class="text-center mb-4">
            <div class="system-logo mb-3 shadow-sm">
                <img src="Images/logo1.jpg" alt="GenTri's Best Logo" style="width:100%;height:100%;object-fit:cover;">
            </div>
            <h1 class="h4 mb-1 fw-bold text-sky">Set New Password</h1>
            <p class="text-muted small">Enter a new password for your account.</p>
        </div>

        <!-- Invalid token state -->
        <div id="invalidToken" class="d-none text-center py-3">
            <i class="fa-solid fa-circle-xmark fa-3x text-danger mb-3"></i>
            <h5 class="text-danger">Invalid or Expired Link</h5>
            <p class="text-muted small">This password reset link is invalid or has already expired.</p>
            <a href="forgot_password.html" class="btn btn-sky w-100 py-2 fw-semibold mt-2">
                <i class="fa-solid fa-rotate-right me-2"></i>Request a New Link
            </a>
        </div>

        <!-- Success state -->
        <div id="successState" class="d-none text-center py-3">
            <i class="fa-solid fa-circle-check fa-3x text-success mb-3"></i>
            <h5 class="text-success">Password Reset!</h5>
            <p class="text-muted small">Your password has been updated. You can now log in.</p>
            <a href="GenTrisBest_Login.html" class="btn btn-sky w-100 py-2 fw-semibold mt-2">
                <i class="fa-solid fa-arrow-right-to-bracket me-2"></i>Go to Login
            </a>
        </div>

        <!-- Reset form -->
        <div id="resetFormWrap">
            <div id="alertBox" class="alert d-none align-items-center py-2" role="alert">
                <i id="alertIcon" class="me-2"></i>
                <span id="alertText" class="small"></span>
            </div>

            <form id="resetForm" autocomplete="off">
                <input type="hidden" id="tokenInput" name="token">

                <div class="input-group mb-2 shadow-sm rounded">
                    <span class="input-group-text bg-white border-end-0">
                        <i class="fa-solid fa-lock text-sky"></i>
                    </span>
                    <input type="password" name="new_password" id="newPassword"
                        class="form-control border-start-0 ps-0"
                        placeholder="New password" required minlength="8" autocomplete="new-password">
                    <button type="button" class="btn btn-outline-secondary border-start-0" id="toggleNew"
                        tabindex="-1">
                        <i class="fa-solid fa-eye-slash fa-sm"></i>
                    </button>
                </div>

                <!-- Password strength indicator -->
                <div class="mb-3 px-1">
                    <div class="bg-light rounded" style="height:4px;">
                        <div id="strengthBar" class="strength-bar bg-danger" style="width:0%;"></div>
                    </div>
                    <small id="strengthLabel" class="text-muted"></small>
                </div>

                <div class="input-group mb-4 shadow-sm rounded">
                    <span class="input-group-text bg-white border-end-0">
                        <i class="fa-solid fa-lock text-sky"></i>
                    </span>
                    <input type="password" name="confirm_password" id="confirmPassword"
                        class="form-control border-start-0 ps-0"
                        placeholder="Confirm new password" required autocomplete="new-password">
                    <button type="button" class="btn btn-outline-secondary border-start-0" id="toggleConfirm"
                        tabindex="-1">
                        <i class="fa-solid fa-eye-slash fa-sm"></i>
                    </button>
                </div>

                <button type="submit" id="submitBtn" class="btn btn-sky w-100 py-2 fw-semibold shadow-sm">
                    <span id="btnText"><i class="fa-solid fa-key me-2"></i>Reset Password</span>
                    <span id="btnSpinner" class="d-none">
                        <span class="spinner-border spinner-border-sm me-2"></span>Saving…
                    </span>
                </button>
            </form>

            <div class="text-center mt-3 small">
                <a href="GenTrisBest_Login.html" class="text-decoration-none text-sky fw-medium">
                    <i class="fa-solid fa-arrow-left me-1"></i>Back to Login
                </a>
            </div>
        </div>
    </main>

    <script>
        // Read token from URL
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');

        if (!token) {
            document.getElementById('resetFormWrap').classList.add('d-none');
            document.getElementById('invalidToken').classList.remove('d-none');
        } else {
            document.getElementById('tokenInput').value = token;
        }

        // Toggle password visibility
        function toggleVisibility(btnId, inputId) {
            document.getElementById(btnId).addEventListener('click', () => {
                const input = document.getElementById(inputId);
                const icon  = document.querySelector(`#${btnId} i`);
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.className = 'fa-solid fa-eye fa-sm';
                } else {
                    input.type = 'password';
                    icon.className = 'fa-solid fa-eye-slash fa-sm';
                }
            });
        }
        toggleVisibility('toggleNew', 'newPassword');
        toggleVisibility('toggleConfirm', 'confirmPassword');

        // Password strength
        const newPasswordInput = document.getElementById('newPassword');
        const strengthBar      = document.getElementById('strengthBar');
        const strengthLabel    = document.getElementById('strengthLabel');

        newPasswordInput.addEventListener('input', () => {
            const val = newPasswordInput.value;
            let score = 0;
            if (val.length >= 8)  score++;
            if (/[A-Z]/.test(val)) score++;
            if (/[0-9]/.test(val)) score++;
            if (/[^A-Za-z0-9]/.test(val)) score++;

            const levels = [
                { pct: '25%', cls: 'bg-danger',  label: 'Weak' },
                { pct: '50%', cls: 'bg-warning',  label: 'Fair' },
                { pct: '75%', cls: 'bg-info',     label: 'Good' },
                { pct: '100%', cls: 'bg-success', label: 'Strong' },
            ];
            const lvl = levels[score - 1] || { pct: '0%', cls: 'bg-danger', label: '' };
            strengthBar.style.width = lvl.pct;
            strengthBar.className   = `strength-bar ${lvl.cls}`;
            strengthLabel.textContent = lvl.label ? `Strength: ${lvl.label}` : '';
        });

        // Form submit
        const form       = document.getElementById('resetForm');
        const alertBox   = document.getElementById('alertBox');
        const alertIcon  = document.getElementById('alertIcon');
        const alertText  = document.getElementById('alertText');
        const submitBtn  = document.getElementById('submitBtn');
        const btnText    = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');

        function showAlert(type, icon, message) {
            alertBox.className = `alert alert-${type} d-flex align-items-center py-2`;
            alertIcon.className = `fa-solid ${icon} me-2`;
            alertText.textContent = message;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            alertBox.classList.add('d-none');

            const pw  = document.getElementById('newPassword').value;
            const cpw = document.getElementById('confirmPassword').value;

            if (pw !== cpw) {
                showAlert('danger', 'fa-circle-exclamation', 'Passwords do not match.');
                return;
            }
            if (pw.length < 8) {
                showAlert('danger', 'fa-circle-exclamation', 'Password must be at least 8 characters.');
                return;
            }

            btnText.classList.add('d-none');
            btnSpinner.classList.remove('d-none');
            submitBtn.disabled = true;

            try {
                const res  = await fetch('reset_password.php', { method: 'POST', body: new FormData(form) });
                const data = await res.json();

                if (data.success) {
                    document.getElementById('resetFormWrap').classList.add('d-none');
                    document.getElementById('successState').classList.remove('d-none');
                } else {
                    showAlert('danger', 'fa-circle-exclamation', data.error || 'Something went wrong. Please try again.');
                    if (data.error && (data.error.includes('expired') || data.error.includes('invalid') || data.error.includes('already been used'))) {
                        setTimeout(() => {
                            document.getElementById('resetFormWrap').classList.add('d-none');
                            document.getElementById('invalidToken').classList.remove('d-none');
                        }, 2000);
                    }
                }
            } catch {
                showAlert('danger', 'fa-circle-exclamation', 'Network error. Please try again.');
            } finally {
                btnText.classList.remove('d-none');
                btnSpinner.classList.add('d-none');
                submitBtn.disabled = false;
            }
        });
    </script>
</body>

</html>

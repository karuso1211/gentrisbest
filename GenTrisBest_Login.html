<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GenTri's Best | Login</title>
    <link rel="icon" type="image/png" href="Images/logo1.jpg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --sky-blue: #0ea5e9;
            --sky-blue-hover: #0284c7;
            --sky-blue-light: #e0f2fe;
        }

        body {
            background-color: #f0f9ff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            border-radius: 1rem;
            box-shadow: 0 0.5rem 1rem rgba(14, 165, 233, 0.15);
        }

        .system-logo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            background-color: white;
            color: var(--sky-blue);
            border: 3px solid var(--sky-blue);
        }

        .bg-sky {
            background-color: var(--sky-blue) !important;
            color: white;
        }

        .text-sky {
            color: var(--sky-blue) !important;
        }

        .btn-sky {
            background-color: var(--sky-blue);
            color: white;
            border: none;
        }

        .btn-sky:hover {
            background-color: var(--sky-blue-hover);
            color: white;
        }

        .input-group-text i {
            color: var(--sky-blue);
        }
    </style>
</head>

<body>

    <main class="card login-card p-4 border-0">
        <div class="text-center mb-4">
            <div class="system-logo mb-3 shadow-sm" style="overflow: hidden;">
                <img src="Images/logo1.jpg" alt="GenTri's Best Logo"
                    style="width: 100%; height: 100%; object-fit: cover;">
            </div>
            <h1 class="h4 mb-2 fw-bold text-sky">Dairy Box GenTri</h1>
            <p class="text-muted small">Enter your credentials to access your account</p>
        </div>

        <div id="errorBox" class="alert alert-danger d-none align-items-center py-2" role="alert">
            <i class="fa-solid fa-circle-exclamation me-2"></i>
            <span id="errorText" class="small">Invalid username or password.</span>
        </div>

        <form id="loginForm" action="login.php" method="POST" autocomplete="off">

            <div class="input-group mb-3 shadow-sm rounded">
                <span class="input-group-text bg-white border-end-0"><i class="fa-solid fa-user"></i></span>
                <input type="text" name="username" id="username" class="form-control border-start-0 ps-0" placeholder="Username"
                    required autocomplete="off">
            </div>


            <div class="input-group mb-3 shadow-sm rounded">
                <span class="input-group-text bg-white border-end-0"><i class="fa-solid fa-lock text-sky"></i></span>
                <input type="password" name="password" id="password" class="form-control border-start-0 ps-0" placeholder="Password" required autocomplete="off">
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4 small">
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="rememberMe" style="accent-color: #0ea5e9;">
                    <label class="form-check-label text-muted" for="rememberMe">Remember me</label>
                </div>
                <div>
                    <a href="register.html" class="text-decoration-none fw-medium text-sky me-3">Register!</a>
                    <a href="" class="text-decoration-none fw-medium text-sky">Forgot password?</a>
                </div>
            </div>
            
            <button name="loginButton" id="loginButton" type="submit" class="btn btn-sky w-100 py-2 fw-semibold shadow-sm">Secure Login</button>
        </form>
    </main>


    <script src="app.js"></script>
</body>

</html>

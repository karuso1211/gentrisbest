<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GenTri's Best | Register</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Your custom styles -->
    <style>
        :root {
            --sky-blue: #0ea5e9;
            --sky-blue-hover: #0284c7;
            --sky-blue-light: #e0f2fe;
        }

        body {
            background-color: #f0f9ff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            border-radius: 1rem;
            box-shadow: 0 0.5rem 1rem rgba(14, 165, 233, 0.15);
        }

        .system-logo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            background-color: white;
            color: var(--sky-blue);
            border: 3px solid var(--sky-blue);
        }

        .bg-sky {
            background-color: var(--sky-blue) !important;
            color: white;
        }

        .text-sky {
            color: var(--sky-blue) !important;
        }

        .btn-sky {
            background-color: var(--sky-blue);
            color: white;
            border: none;
        }

        .btn-sky:hover {
            background-color: var(--sky-blue-hover);
            color: white;
        }

        .input-group-text i {
            color: var(--sky-blue);
        }
    </style>
</head>

<body>

    <main class="card login-card p-4 border-0">
        <div class="text-center mb-4">
            <div class="system-logo mb-3 shadow-sm" style="overflow: hidden;">
                <img src="Images/logo1.jpg" alt="GenTri's Best Logo"
                    style="width: 100%; height: 100%; object-fit: cover;">
            </div>
            <h1 class="h4 mb-2 fw-bold text-sky">Register for Dairy Box GenTri</h1>
            <p class="text-muted small">Fill in the details below to create your account</p>
        </div>

        <div id="errorBox" class="alert alert-danger d-none align-items-center py-2" role="alert">
            <i class="fa-solid fa-circle-exclamation me-2"></i>
            <span id="errorText" class="small">Passwords do not match.</span>
        </div>

        <div id="successBox" class="alert alert-success d-none align-items-center py-2" role="alert">
            <i class="fa-solid fa-circle-check me-2"></i>
            <span id="successText" class="small">Registration successful! Redirecting...</span>
        </div>

        <form id="registerForm" action="process_register.php" method="POST">

            <!-- First Name -->
            <div class="input-group mb-3 shadow-sm rounded">
                <span class="input-group-text bg-white border-end-0"><i class="fa-solid fa-id-card"></i></span>
                <input type="text" id="firstName" name="firstName" class="form-control border-start-0 ps-0"
                    placeholder="First Name" required autocomplete="given-name">
            </div>

            <!-- Last Name -->
            <div class="input-group mb-3 shadow-sm rounded">
                <span class="input-group-text bg-white border-end-0"><i class="fa-solid fa-id-card"></i></span>
                <input type="text" id="lastName" name="lastName" class="form-control border-start-0 ps-0"
                    placeholder="Last Name" required autocomplete="family-name">
            </div>

            <!-- Username -->
            <div class="input-group mb-3 shadow-sm rounded">
                <span class="input-group-text bg-white border-end-0"><i class="fa-solid fa-user"></i></span>
                <input type="text" id="username" name="username" class="form-control border-start-0 ps-0"
                    placeholder="Username" required autocomplete="username">
            </div>

            <!-- Contact Number -->
            <div class="input-group mb-3 shadow-sm rounded">
                <span class="input-group-text bg-white border-end-0"><i class="fa-solid fa-phone"></i></span>
                <input type="tel" id="contactNumber" name="contactNumber" class="form-control border-start-0 ps-0"
                    placeholder="Contact Number" required autocomplete="tel" pattern="[0-9]{11}"
                    title="Please enter a valid 11-digit mobile number">
            </div>

            <!-- Email -->
            <div class="input-group mb-3 shadow-sm rounded">
                <span class="input-group-text bg-white border-end-0"><i class="fa-solid fa-envelope"></i></span>
                <input type="email" id="email" name="email" class="form-control border-start-0 ps-0" placeholder="Email"
                    required autocomplete="email" pattern=".*@.*\.com$" title="Email must contain @ and end with .com">
            </div>

            <!-- Password -->
            <div class="input-group mb-3 shadow-sm rounded">
                <span class="input-group-text bg-white border-end-0"><i class="fa-solid fa-lock text-sky"></i></span>
                <input type="password" id="password" name="password"
                    class="form-control border-start-0 border-end-0 ps-0 pe-0" placeholder="Password" required
                    autocomplete="new-password">
                <button class="btn btn-outline-secondary bg-white border-start-0 border text-muted" type="button"
                    id="togglePasswordBtn">
                    <i class="fa-solid fa-eye" id="togglePasswordIcon"></i>
                </button>
            </div>

            <!-- Confirm Password -->
            <div class="input-group mb-3 shadow-sm rounded">
                <span class="input-group-text bg-white border-end-0"><i class="fa-solid fa-lock"></i></span>
                <input type="password" id="confirmPassword" name="confirmPassword"
                    class="form-control border-start-0 ps-0" placeholder="Confirm Password" required
                    autocomplete="new-password">
            </div>



            <!-- Register Button -->
            <button type="submit" class="btn btn-sky w-100 py-2 fw-semibold shadow-sm">
                Register Account
            </button>

            <!-- Back to Login -->
            <div class="text-center mt-3 small">
                <span class="text-muted">Already have an account?</span>
                <a href="GenTrisBest_Login.html" class="text-sky fw-medium">Login here</a>
            </div>
        </form>
    </main>

    <script src="app.js"></script>
</body>

</html>

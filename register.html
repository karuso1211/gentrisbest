<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GenTri's Best | Register</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Your custom styles -->
    <style>
        :root {
            --sky-blue: #0ea5e9;
            --sky-blue-hover: #0284c7;
            --sky-blue-light: #e0f2fe;
        }

        body {
            background-color: #f0f9ff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            border-radius: 1rem;
            box-shadow: 0 0.5rem 1rem rgba(14, 165, 233, 0.15);
        }

        .system-logo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            background-color: white;
            color: var(--sky-blue);
            border: 3px solid var(--sky-blue);
        }

        .bg-sky {
            background-color: var(--sky-blue) !important;
            color: white;
        }

        .text-sky {
            color: var(--sky-blue) !important;
        }

        .btn-sky {
            background-color: var(--sky-blue);
            color: white;
            border: none;
        }

        .btn-sky:hover {
            background-color: var(--sky-blue-hover);
            color: white;
        }

        .input-group-text i {
            color: var(--sky-blue);
        }
        input[type="password"]::-ms-reveal,
        input[type="password"]::-ms-clear { display: none; }

        #pwRequirements,
        #confirmMsg { display: none; }
    </style>
</head>

<body>

    <main class="card login-card p-4 border-0">
        <div class="text-center mb-4">
            <div class="system-logo mb-3 shadow-sm" style="overflow: hidden;">
                <img src="Images/logo1.jpg" alt="GenTri's Best Logo"
                    style="width: 100%; height: 100%; object-fit: cover;">
            </div>
            <h1 class="h4 mb-2 fw-bold text-sky">Register for Dairy Box GenTri</h1>
            <p class="text-muted small">Fill in the details below to create your account</p>
        </div>

        <div id="errorBox" class="alert alert-danger d-none align-items-center py-2" role="alert">
            <i class="fa-solid fa-circle-exclamation me-2"></i>
            <span id="errorText" class="small">Passwords do not match.</span>
        </div>

        <div id="successBox" class="alert alert-success d-none align-items-center py-2" role="alert">
            <i class="fa-solid fa-circle-check me-2"></i>
            <span id="successText" class="small">Registration successful! Redirecting...</span>
        </div>

        <form id="registerForm" action="process_register.php" method="POST">

            <!-- First Name -->
            <div class="input-group mb-3 shadow-sm rounded">
                <span class="input-group-text bg-white border-end-0"><i class="fa-solid fa-id-card"></i></span>
                <input type="text" id="firstName" name="firstName" class="form-control border-start-0 ps-0"
                    placeholder="First Name" required autocomplete="off">
            </div>

            <!-- Last Name -->
            <div class="input-group mb-3 shadow-sm rounded">
                <span class="input-group-text bg-white border-end-0"><i class="fa-solid fa-id-card"></i></span>
                <input type="text" id="lastName" name="lastName" class="form-control border-start-0 ps-0"
                    placeholder="Last Name" required autocomplete="off">
            </div>

            <!-- Username -->
            <div class="input-group mb-3 shadow-sm rounded">
                <span class="input-group-text bg-white border-end-0"><i class="fa-solid fa-user"></i></span>
                <input type="text" id="username" name="username" class="form-control border-start-0 ps-0"
                    placeholder="Username" required autocomplete="off">
            </div>

            <!-- Contact Number -->
            <div class="input-group mb-3 shadow-sm rounded">
                <span class="input-group-text bg-white border-end-0"><i class="fa-solid fa-phone"></i></span>
                <input type="tel" id="contactNumber" name="contactNumber" class="form-control border-start-0 ps-0"
                    placeholder="Contact Number" required autocomplete="off" pattern="[0-9]{11}"
                    title="Please enter a valid 11-digit mobile number">
            </div>

            <!-- Email -->
            <div class="input-group mb-3 shadow-sm rounded">
                <span class="input-group-text bg-white border-end-0"><i class="fa-solid fa-envelope"></i></span>
                <input type="email" id="email" name="email" class="form-control border-start-0 ps-0" placeholder="Email"
                    required autocomplete="off" pattern=".*@.*\.com$" title="Email must contain @ and end with .com">
            </div>

            <!-- Password -->
            <div class="input-group mb-1 shadow-sm rounded">
                <span class="input-group-text bg-white border-end-0"><i class="fa-solid fa-lock text-sky"></i></span>
                <input type="password" id="password" name="password"
                    class="form-control border-start-0 border-end-0 ps-0 pe-0" placeholder="Password" required
                    autocomplete="off">
                <span class="input-group-text bg-white border-start-0 text-sky" id="toggleRegPasswordBtn" role="button" style="cursor:pointer" tabindex="-1">
                    <i class="fa-solid fa-eye fa-sm" id="toggleRegPasswordIcon"></i>
                </span>
            </div>
            <!-- Password requirements -->
            <ul id="pwRequirements" class="list-unstyled small mb-3 ps-1">
                <li id="req-length"  class="text-danger"><i class="fa-solid fa-circle-xmark me-1"></i>At least 8 characters</li>
                <li id="req-upper"   class="text-danger"><i class="fa-solid fa-circle-xmark me-1"></i>At least 1 uppercase letter</li>
                <li id="req-special" class="text-danger"><i class="fa-solid fa-circle-xmark me-1"></i>At least 1 special character</li>
            </ul>

            <!-- Confirm Password -->
            <div class="input-group mb-1 shadow-sm rounded">
                <span class="input-group-text bg-white border-end-0"><i class="fa-solid fa-lock"></i></span>
                <input type="password" id="confirmPassword" name="confirmPassword"
                    class="form-control border-start-0 border-end-0 ps-0" placeholder="Confirm Password" required
                    autocomplete="off">
                <span class="input-group-text bg-white border-start-0 text-sky" id="toggleConfirmPasswordBtn" role="button" style="cursor:pointer" tabindex="-1">
                    <i class="fa-solid fa-eye fa-sm" id="toggleConfirmPasswordIcon"></i>
                </span>
            </div>
            <p id="confirmMsg" class="small mb-3 ps-1"></p>



            <!-- Register Button -->
            <button type="submit" class="btn btn-sky w-100 py-2 fw-semibold shadow-sm">
                Register Account
            </button>

            <!-- Back to Login -->
            <div class="text-center mt-3 small">
                <span class="text-muted">Already have an account?</span>
                <a href="GenTrisBest_Login.html" class="text-sky fw-medium">Login here</a>
            </div>
        </form>
    </main>

    <script src="app.js"></script>
    <script>
        // Password visibility toggles
        function setupToggle(btnId, inputId, iconId) {
            const btn = document.getElementById(btnId);
            if (!btn) return;
            btn.addEventListener('click', function(e) {
                e.preventDefault();
                const input = document.getElementById(inputId);
                const icon  = document.getElementById(iconId);
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.classList.replace('fa-eye', 'fa-eye-slash');
                } else {
                    input.type = 'password';
                    icon.classList.replace('fa-eye-slash', 'fa-eye');
                }
            });
        }

        // Registration Form Validation
        document.addEventListener('DOMContentLoaded', function() {
            setupToggle('toggleRegPasswordBtn', 'password', 'toggleRegPasswordIcon');
            setupToggle('toggleConfirmPasswordBtn', 'confirmPassword', 'toggleConfirmPasswordIcon');

            const pwInput      = document.getElementById('password');
            const confirmInput = document.getElementById('confirmPassword');
            const reqList      = document.getElementById('pwRequirements');
            const confirmMsg   = document.getElementById('confirmMsg');

            function setReq(id, met) {
                const el = document.getElementById(id);
                const icon = el.querySelector('i');
                if (met) {
                    el.className = 'text-success';
                    icon.className = 'fa-solid fa-circle-check me-1';
                } else {
                    el.className = 'text-danger';
                    icon.className = 'fa-solid fa-circle-xmark me-1';
                }
            }

            pwInput.addEventListener('input', function() {
                const val = pwInput.value;
                reqList.style.display = val.length ? 'block' : 'none';
                setReq('req-length',  val.length >= 8);
                setReq('req-upper',   /[A-Z]/.test(val));
                setReq('req-special', /[^A-Za-z0-9]/.test(val));
                if (confirmInput.value) updateConfirmMsg();
            });

            function updateConfirmMsg() {
                const match = pwInput.value === confirmInput.value;
                confirmMsg.style.display = confirmInput.value.length ? 'block' : 'none';
                if (match) {
                    confirmMsg.className = 'small mb-3 ps-1 text-success';
                    confirmMsg.innerHTML = '<i class="fa-solid fa-circle-check me-1"></i>Passwords match';
                } else {
                    confirmMsg.className = 'small mb-3 ps-1 text-danger';
                    confirmMsg.innerHTML = '<i class="fa-solid fa-circle-xmark me-1"></i>Passwords do not match';
                }
            }

            confirmInput.addEventListener('input', updateConfirmMsg);

            const registerForm = document.getElementById('registerForm');
            if (registerForm) {
                registerForm.addEventListener('submit', function(e) {
                    e.preventDefault();

                    const password = pwInput.value;
                    const confirmPassword = confirmInput.value;
                    const errorBox  = document.getElementById('errorBox');
                    const errorText = document.getElementById('errorText');

                    errorBox.classList.add('d-none');
                    errorBox.classList.remove('d-flex');

                    if (password.length < 8 || !/[A-Z]/.test(password) || !/[^A-Za-z0-9]/.test(password)) {
                        reqList.style.display = 'block';
                        setReq('req-length',  password.length >= 8);
                        setReq('req-upper',   /[A-Z]/.test(password));
                        setReq('req-special', /[^A-Za-z0-9]/.test(password));
                        pwInput.focus();
                        return false;
                    }

                    if (password !== confirmPassword) {
                        updateConfirmMsg();
                        confirmInput.focus();
                        return false;
                    }

                    registerForm.submit();
                });
            }
        });
    </script>
    <script src="transitions.js"></script>
</body>

</html>

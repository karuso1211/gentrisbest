<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GenTri's Best | Forgot Password</title>
    <link rel="icon" type="image/png" href="Images/logo1.jpg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --sky-blue: #0ea5e9;
            --sky-blue-hover: #0284c7;
            --sky-blue-light: #e0f2fe;
        }

        body {
            background-color: #f0f9ff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        .card {
            width: 100%;
            max-width: 420px;
            border-radius: 1rem;
            box-shadow: 0 0.5rem 1rem rgba(14, 165, 233, 0.15);
        }

        .system-logo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            overflow: hidden;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 3px solid var(--sky-blue);
        }

        .btn-sky {
            background-color: var(--sky-blue);
            color: white;
            border: none;
        }

        .btn-sky:hover {
            background-color: var(--sky-blue-hover);
            color: white;
        }

        .text-sky { color: var(--sky-blue) !important; }

        .input-group-text i { color: var(--sky-blue); }
    </style>
</head>

<body>
    <main class="card p-4 border-0">
        <div class="text-center mb-4">
            <div class="system-logo mb-3 shadow-sm">
                <img src="Images/logo1.jpg" alt="GenTri's Best Logo" style="width:100%;height:100%;object-fit:cover;">
            </div>
            <h1 class="h4 mb-1 fw-bold text-sky">Forgot Password</h1>
            <p class="text-muted small">Enter your email and we'll send you a reset link.</p>
        </div>

        <div id="alertBox" class="alert d-none align-items-center py-2" role="alert">
            <i id="alertIcon" class="me-2"></i>
            <span id="alertText" class="small"></span>
        </div>

        <form id="forgotForm" autocomplete="off">
            <div class="input-group mb-3 shadow-sm rounded">
                <span class="input-group-text bg-white border-end-0">
                    <i class="fa-solid fa-envelope text-sky"></i>
                </span>
                <input type="email" name="email" id="emailInput"
                    class="form-control border-start-0 ps-0"
                    placeholder="Registered email address" required autocomplete="off">
            </div>

            <button type="submit" id="submitBtn" class="btn btn-sky w-100 py-2 fw-semibold shadow-sm">
                <span id="btnText"><i class="fa-solid fa-paper-plane me-2"></i>Send Reset Link</span>
                <span id="btnSpinner" class="d-none">
                    <span class="spinner-border spinner-border-sm me-2"></span>Sending…
                </span>
            </button>
        </form>

        <div class="text-center mt-3 small">
            <a href="GenTrisBest_Login.html" class="text-decoration-none text-sky fw-medium">
                <i class="fa-solid fa-arrow-left me-1"></i>Back to Login
            </a>
        </div>
    </main>

    <script>
        const form      = document.getElementById('forgotForm');
        const alertBox  = document.getElementById('alertBox');
        const alertIcon = document.getElementById('alertIcon');
        const alertText = document.getElementById('alertText');
        const submitBtn = document.getElementById('submitBtn');
        const btnText   = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');

        function showAlert(type, icon, message) {
            alertBox.className = `alert alert-${type} d-flex align-items-center py-2`;
            alertIcon.className = `fa-solid ${icon} me-2`;
            alertText.textContent = message;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            alertBox.classList.add('d-none');

            btnText.classList.add('d-none');
            btnSpinner.classList.remove('d-none');
            submitBtn.disabled = true;

            const formData = new FormData(form);

            try {
                const res = await fetch('forgot_password.php', { method: 'POST', body: formData });
                const data = await res.json();

                if (data.success) {
                    showAlert('success', 'fa-circle-check', data.message);
                    form.reset();
                } else {
                    showAlert('danger', 'fa-circle-exclamation', data.error || 'Something went wrong. Please try again.');
                }
            } catch {
                showAlert('danger', 'fa-circle-exclamation', 'Network error. Please try again.');
            } finally {
                btnText.classList.remove('d-none');
                btnSpinner.classList.add('d-none');
                submitBtn.disabled = false;
            }
        });
    </script>
</body>

</html>
